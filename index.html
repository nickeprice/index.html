<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>River Fishing Companion</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #242424;
            --bg-tactile: #333333;
            --accent: #4CAF50;
            --text-main: #E0E0E0;
            --text-dim: #9E9E9E;
            --danger: #CF6679;
        }

        /* Strict Mobile Optimization */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            -webkit-overflow-scrolling: touch; 
            overflow-x: hidden;
            /* NO height: 100% to protect iOS dropdowns */
        }
        
        /* Navigation */
        header {
            background-color: var(--bg-panel);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--bg-tactile);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .menu-btn { background: none; border: none; color: var(--text-main); font-size: 24px; cursor: pointer; }
        .nav-drawer {
            display: none; position: fixed; top: 60px; left: 0; width: 100%; background: var(--bg-panel); z-index: 99; flex-direction: column; border-bottom: 1px solid var(--bg-tactile);
        }
        .nav-drawer.open { display: flex; }
        .nav-btn { padding: 15px; border: none; border-bottom: 1px solid var(--bg-tactile); background: none; color: var(--text-main); text-align: left; font-size: 16px; }
        
        /* Tools Containers */
        .tool-container { display: none; padding: 15px; padding-bottom: 100px; }
        .tool-container.active { display: block; }

        /* Tactile UI Elements */
        .panel { background: var(--bg-panel); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--bg-tactile); }
        label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input { 
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; 
            background: var(--bg-tactile); color: var(--text-main); border: none; 
            font-size: 16px; /* 16px prevents iOS auto-zoom */
            appearance: none; -webkit-appearance: none;
        }
        button.action { width: 100%; padding: 15px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Gear Sim HUD */
        .hud { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .hud-metric { text-align: center; background: var(--bg-tactile); padding: 10px; border-radius: 6px; flex: 1; margin: 0 5px; }
        .hud-metric:first-child { margin-left: 0; }
        .hud-metric:last-child { margin-right: 0; }
        .hud-val { font-size: 18px; font-weight: bold; color: var(--accent); }

        /* Debug Console */
        #debug-console {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: 40vh; 
            background: rgba(0,0,0,0.9); border-top: 2px solid var(--accent); z-index: 1000; 
            overflow-y: auto; padding: 10px; font-family: monospace; font-size: 11px; color: #0f0;
        }
        #debug-console.open { display: block; }
        .log-entry { border-bottom: 1px solid #333; padding: 4px 0; }
        
        /* Custom Toast Notification (Replaces alerts) */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg-main); padding: 10px 20px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 2000; font-weight: bold; }
    </style>
</head>
<body>

    <header id="main-header">
        <button class="menu-btn" onclick="toggleMenu()">☰ Tools</button>
        <span style="font-weight: bold; color: var(--accent);">Puyallup Dashboard</span>
    </header>

    <nav class="nav-drawer" id="nav-drawer">
        <button class="nav-btn" onclick="switchTool('water-report')">1. Water Report</button>
        <button class="nav-btn" onclick="switchTool('gear-sim')">2. Gear Sim</button>
        <button class="nav-btn" onclick="switchTool('catch-log')">3. Catch Log</button>
    </nav>

    <!-- TOOL 1: WATER REPORT -->
    <div id="water-report" class="tool-container active">
        <div class="panel">
            <h2 style="margin-bottom: 10px;">Live Conditions</h2>
            <div class="hud">
                <div class="hud-metric">Flow<br><span class="hud-val" id="wr-cfs">--</span></div>
                <div class="hud-metric">NTU<br><span class="hud-val" id="wr-ntu">--</span></div>
                <div class="hud-metric">FMI<br><span class="hud-val" id="wr-fmi">--</span></div>
            </div>
            <p id="wr-trend" style="color: var(--text-dim); font-size: 14px; margin-top: 10px;">Fetching from Python API...</p>
        </div>
    </div>

    <!-- TOOL 2: GEAR SIM -->
    <div id="gear-sim" class="tool-container">
        <div class="panel" style="position: sticky; top: 65px; z-index: 90;">
            <div class="hud">
                <div class="hud-metric">Rating<br><span class="hud-val" id="gs-rating">5.0</span></div>
                <div class="hud-metric">Target<br><span class="hud-val" id="gs-target">4.0"-12.0"</span></div>
                <div class="hud-metric">Height<br><span class="hud-val" id="gs-height">8.2"</span></div>
            </div>
        </div>
        
        <div class="panel">
            <label>Mainline</label>
            <select id="sim-mainline" onchange="syncGear(); runPhysicsEngine();">
                <option value="40_braid">40 lb Braided</option>
                <option value="50_braid">50 lb Braided</option>
                <option value="15_mono">15 lb Monofilament</option>
            </select>
            
            <label>Leader Material & Length</label>
            <select id="sim-leader" onchange="syncGear(); runPhysicsEngine();">
                <option value="12_copoly">12 lb Copolymer (36")</option>
                <option value="12_mono">12 lb Monofilament (36")</option>
                <option value="10_fluoro">10 lb Fluorocarbon (36")</option>
            </select>

            <label>Terminal Tackle</label>
            <select id="sim-terminal" onchange="syncGear(); runPhysicsEngine();">
                <option value="corky_yarn">Standard Corky & Yarn</option>
                <option value="foam_cheater">Foam Cheater (High Float)</option>
                <option value="corky_shrimp">Corky + Sand Shrimp (Heavy)</option>
            </select>

            <label>Rigging Hardware</label>
            <select id="sim-hardware" onchange="syncGear(); runPhysicsEngine();">
                <option value="sliding_swivel">Sliding Swivel</option>
                <option value="fixed_inline">Fixed Inline</option>
            </select>
        </div>
    </div>

    <!-- TOOL 3: CATCH LOG -->
    <div id="catch-log" class="tool-container">
        <div class="panel">
            <label>Angler Name</label>
            <input type="text" id="log-name" value="Nicholas">
            
            <label>Date & Time</label>
            <input type="datetime-local" id="log-date">
            
            <label>GPS Coordinates</label>
            <input type="text" id="log-gps" readonly placeholder="Fetching location...">

            <label>Current Rig Setup (Auto-Synced)</label>
            <input type="text" id="log-rig-summary" readonly style="color: var(--accent);">

            <label>Hook Location</label>
            <select id="log-hook">
                <option value="Fair">Fair (Mouth)</option>
                <option value="Foul_Back">Foul (Back/Dorsal)</option>
                <option value="Foul_Belly">Foul (Belly/Pectoral)</option>
                <option value="Foul_Tail">Foul (Tail)</option>
            </select>
            
            <button class="action" onclick="submitCatch()">Log Catch & Train AI</button>
        </div>
    </div>

    <!-- UI Overlays -->
    <div id="debug-console"></div>
    <div id="toast">Message</div>

    <script>
        // --- 1. SYSTEM INITIALIZATION & STATE ---
        const State = {
            env: { cfs: 1000, ntu: 15, temp_delta: 0 },
            gear: { mainline: '40_braid', leader: '12_copoly', terminal: 'corky_yarn', hardware: 'sliding_swivel' },
            ai: { heightBias: 0.0, dragModifier: 1.0, targetZoneMin: 4.0, targetZoneMax: 12.0 }
        };

        // --- 2. TACTILE DEBUG MATRIX ---
        const Debugger = {
            log: function(msg, source = "SYS") {
                const con = document.getElementById('debug-console');
                const time = new Date().toISOString().split('T')[1].slice(0,-1);
                con.innerHTML += `<div class="log-entry">[${time}] <b>${source}</b>: ${msg}</div>`;
                con.scrollTop = con.scrollHeight;
                console.log(`[${source}] ${msg}`);
            }
        };

        // Double tap header to toggle debugger
        let lastTap = 0;
        document.getElementById('main-header').addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            if (currentTime - lastTap < 300) {
                document.getElementById('debug-console').classList.toggle('open');
                Debugger.log("Debug Matrix Toggled", "UI");
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = 1;
            setTimeout(() => toast.style.opacity = 0, 2500);
        }

        // --- 3. NAVIGATION & SYNC ---
        function toggleMenu() {
            document.getElementById('nav-drawer').classList.toggle('open');
        }

        function switchTool(toolId) {
            document.querySelectorAll('.tool-container').forEach(el => el.classList.remove('active'));
            document.getElementById(toolId).classList.add('active');
            toggleMenu();
            if (toolId === 'gear-sim') runPhysicsEngine();
            if (toolId === 'catch-log') syncGearToLog();
            Debugger.log(`Switched to ${toolId}`, "UI");
        }

        function syncGear() {
            State.gear.mainline = document.getElementById('sim-mainline').value;
            State.gear.leader = document.getElementById('sim-leader').value;
            State.gear.terminal = document.getElementById('sim-terminal').value;
            State.gear.hardware = document.getElementById('sim-hardware').value;
            Debugger.log(`Gear Synced: ${JSON.stringify(State.gear)}`, "STATE");
        }

        function syncGearToLog() {
            document.getElementById('log-rig-summary').value = 
                `${State.gear.mainline} | ${State.gear.leader} | ${State.gear.terminal}`;
        }

        // --- 4. DATA FETCHING (WATER REPORT) ---
        async function fetchWaterData() {
            Debugger.log("Initiating API fetch to Vercel Backend", "NET");
            try {
                // UPDATE THIS URL TO YOUR ACTUAL VERCEL DEPLOYMENT URL
                const response = await fetch('/api/water-report'); 
                const data = await response.json();
                
                State.env.cfs = data.hydrology.cfs;
                State.env.ntu = data.hydrology.ntu;
                State.env.temp_delta = data.hydrology.temp_delta;

                document.getElementById('wr-cfs').innerText = data.hydrology.cfs;
                document.getElementById('wr-ntu').innerText = data.hydrology.ntu;
                document.getElementById('wr-fmi').innerText = data.kinematics.fmi_score;
                document.getElementById('wr-trend').innerText = `Water is ${data.hydrology.ntu_trend}. Temp delta: ${data.hydrology.temp_delta}°C`;
                
                Debugger.log(`Water Data loaded: CFS ${State.env.cfs}, NTU ${State.env.ntu}`, "NET");
                runMLKNNLoop(); // Adjust AI biases based on new environmental baseline
            } catch (error) {
                Debugger.log(`API Fetch Failed (Using Defaults): ${error.message}`, "ERR");
            }
        }

        // --- 5. GEAR SIM PHYSICS ENGINE ---
        function runPhysicsEngine() {
            Debugger.log("Running Hydrodynamic Math", "PHYSICS");
            
            // 1. Calculate Bottom Boundary Velocity (Slower at bottom)
            let baseVelocity = State.env.cfs * 0.005; 
            let bottomVelocity = baseVelocity * State.ai.dragModifier; 

            // 2. Terminal Lift Calculation (Factoring Leader Diameter/Stiffness)
            let liftBase = 8.0; // inches
            if (State.gear.leader.includes('mono')) liftBase -= 1.0; // Mono bows
            if (State.gear.leader.includes('copoly')) liftBase -= 0.5; // Copoly slightly stiffer
            if (State.gear.terminal === 'foam_cheater') liftBase += 4.0; // High float
            if (State.gear.terminal === 'corky_shrimp') liftBase -= 3.0; // Heavy bait drag

            // Suppress lift based on water velocity pushing it down
            let currentLift = liftBase - (bottomVelocity * 0.2); 
            
            // Apply AI Historical Bias
            let finalHeight = currentLift + State.ai.heightBias;
            
            // 3. Scoring & AI Target Zones
            let rating = 5.0;
            if (finalHeight < State.ai.targetZoneMin) rating -= (State.ai.targetZoneMin - finalHeight) * 0.5;
            if (finalHeight > State.ai.targetZoneMax) rating -= (finalHeight - State.ai.targetZoneMax) * 0.5;
            
            // NTU shifts strike zone (Dirty water = lower target)
            if (State.env.ntu > 25) {
                State.ai.targetZoneMin = 2.0; State.ai.targetZoneMax = 8.0;
            } else {
                State.ai.targetZoneMin = 6.0; State.ai.targetZoneMax = 16.0;
            }

            // Update UI
            document.getElementById('gs-height').innerText = finalHeight.toFixed(1) + '"';
            document.getElementById('gs-target').innerText = `${State.ai.targetZoneMin}"-${State.ai.targetZoneMax}"`;
            document.getElementById('gs-rating').innerText = Math.max(0, rating).toFixed(1);
            
            Debugger.log(`Calculated Height: ${finalHeight.toFixed(1)}", Rating: ${rating.toFixed(1)}`, "PHYSICS");
        }

        // --- 6. CATCH LOG & MACHINE LEARNING LOOP ---
        function getGeolocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const coords = `${position.coords.latitude.toFixed(5)}, ${position.coords.longitude.toFixed(5)}`;
                    document.getElementById('log-gps').value = coords;
                    Debugger.log(`GPS Acquired: ${coords}`, "SYS");
                }, (error) => {
                    document.getElementById('log-gps').value = "Location Access Denied";
                    Debugger.log(`GPS Error: ${error.message}`, "ERR");
                });
            }
        }

        function runMLKNNLoop() {
            Debugger.log("Running KNN AI cluster parsing on historical data", "ML");
            // In a full DB setup, this queries Supabase for catches at matching CFS/NTU
            // Placeholder Logic mimicking ML cluster adjustments:
            if (State.env.cfs > 1500) {
                State.ai.dragModifier = 0.85; // History shows heavy flow needs more drag weight to hold
                Debugger.log("AI Mod: Reduced Drag Modifier for High CFS", "ML");
            }
        }

        async function submitCatch() {
            const hook = document.getElementById('log-hook').value;
            Debugger.log(`Logging catch... Hook: ${hook}`, "DB");
            
            // 1. Train AI immediately on log
            if (hook === 'Foul_Back') { State.ai.heightBias -= 1.5; Debugger.log("AI Mod: Lowered Height Bias (Back Foul)", "ML"); }
            if (hook === 'Foul_Belly') { State.ai.heightBias += 1.5; Debugger.log("AI Mod: Raised Height Bias (Belly Foul)", "ML"); }
            
            const payload = {
                angler: document.getElementById('log-name').value,
                date: document.getElementById('log-date').value || new Date().toISOString(),
                gps: document.getElementById('log-gps').value,
                gear: State.gear,
                env: State.env,
                hook_location: hook
            };

            // SUPABASE INSERT PLACEHOLDER
            /*
            const { data, error } = await supabase.from('catches').insert([payload]);
            if (error) Debugger.log(`Supabase Error: ${error.message}`, "ERR");
            */
           
            Debugger.log(`Catch Payload Saved: ${JSON.stringify(payload)}`, "DB");
            showToast("Catch Logged Successfully!");
            runPhysicsEngine(); // Re-run math with new AI bias
        }

        // --- 7. BOOTSTRAP ---
        window.onload = () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('log-date').value = now.toISOString().slice(0,16);
            
            getGeolocation();
            fetchWaterData(); // Starts the matrix
        };
    </script>
</body>
</html>
